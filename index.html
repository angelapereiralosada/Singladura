<style>
/* Layout: an illustrated world map — pink sea, white land, countries you've been to inked in a small poster palette. Name and figures top-left, a soft white card panel on the right (bottom sheet on phones). Single look by design. */
:root{
  --sea:#F8C8D4;
  --sea-ink:#EE97AE;
  --card:#FFFFFF;
  --ink:#24254A;
  --mute:#6E6A86;
  --line:#F1E1E7;
  --soft:#FFF3F6;
  --red:#D71F2B;
  --cobalt:#3552E0;
  --mustard:#E8A71C;
  --mustard-ink:#9A6400;
  --wine:#8C1D3F;
  --f-display:"Fraunces",Georgia,"Times New Roman",serif;
  --f-hand:"Caveat","Comic Sans MS",cursive;
  --f-body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--sea);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;overflow:hidden;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:0;
}
#map{position:fixed;inset:0;z-index:1;background:radial-gradient(120% 90% at 50% 36%,#FFF3F6 0%,#FCDDE5 52%,#F5BCCB 100%)}
#map canvas{outline:none}
.maptip{position:fixed;left:0;top:0;z-index:4;pointer-events:none;font:700 10.5px/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--ink);background:rgba(255,255,255,.94);padding:6px 10px;border-radius:999px;box-shadow:0 3px 10px rgba(36,37,74,.12)}
.mapfail{position:fixed;z-index:5;left:50%;top:40%;transform:translate(-50%,-50%);background:#fff;border-radius:18px;padding:14px 18px;font-weight:700;max-width:300px;text-align:center;box-shadow:0 10px 30px rgba(190,70,100,.2)}
.mk{position:relative;display:grid;justify-items:center;cursor:pointer;-webkit-tap-highlight-color:transparent}
.mk .mlab{position:absolute;top:100%;left:50%;transform:translate(-50%,3px);white-space:nowrap;font:700 10.5px/1.2 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink);text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 4px #fff,0 0 5px #fff;pointer-events:none}
.mk .mlab.strong{font:italic 500 16px/1.1 var(--f-display);letter-spacing:0;text-transform:none;color:#A3121D}
.badge{width:32px;height:32px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:16px;line-height:1;box-shadow:0 4px 10px rgba(150,40,70,.28),inset 0 0 0 3px var(--sw,#D71F2B);transition:transform .15s}
.mk:hover .badge{transform:scale(1.12)}
.badge.n{background:var(--red);color:#fff;font:400 16px/1 var(--f-display);box-shadow:0 4px 10px rgba(150,40,70,.3),inset 0 0 0 2.5px #fff}
.mk.dim{opacity:.4}
.mk .dot{width:14px;height:14px;border-radius:50%;background:var(--ink);border:3px solid #fff;box-shadow:0 2px 6px rgba(150,40,70,.35)}
.pinm{display:block;width:24px;height:24px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--red);border:2.5px solid #fff;box-shadow:-2px 3px 8px rgba(150,40,70,.35);margin-bottom:5px;transition:transform .15s}
.pinm.blue{background:var(--cobalt)}
.mk.sel .pinm{transform:rotate(-45deg) scale(1.25)}
.mk .pinm+.mlab{top:auto;bottom:100%;transform:translate(-50%,-4px)}
.polam{display:block;width:48px;padding:4px 4px 11px;background:#fff;transform:rotate(var(--r));box-shadow:0 6px 14px rgba(150,40,70,.3);margin-bottom:6px;transition:transform .15s}
.polam img{width:40px;height:40px;object-fit:cover;display:block}
.mk.sel .polam{transform:rotate(var(--r)) scale(1.22)}
.mk .polam+.mlab{top:100%}
.stopn{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#fff;color:var(--ink);border:2px solid var(--ink);font:400 14px/1 var(--f-display);box-shadow:0 3px 8px rgba(150,40,70,.3)}
.mk.cur .stopn{background:var(--red);color:#fff;border-color:#fff;width:36px;height:36px;font-size:17px}
.modem span{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:#fff;border:1.5px solid var(--ink);font-size:13px;line-height:1}
.mover{font-size:19px;width:40px;height:40px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 5px 14px rgba(150,40,70,.35);border:2.5px solid var(--red);line-height:1}
.stamp{width:78px;height:78px;border-radius:50%;border:2.5px solid #A3121D;outline:1px solid #A3121D;outline-offset:-7px;display:grid;place-content:center;text-align:center;color:#A3121D;background:rgba(255,255,255,.55);animation:stamp 1.45s ease forwards;pointer-events:none}
.stamp b{font:700 9px/1 var(--f-body);letter-spacing:.18em}.stamp i{font:italic 500 16px/1.25 var(--f-display)}
@keyframes stamp{0%{transform:rotate(-14deg) scale(2.3);opacity:0}22%{transform:rotate(-14deg) scale(1);opacity:1}75%{opacity:1}100%{transform:rotate(-14deg) scale(1);opacity:0}}
.maplibregl-popup-content{border-radius:18px;padding:13px 15px 12px;box-shadow:0 10px 30px rgba(190,70,100,.25);font-family:var(--f-body);color:var(--ink);min-width:180px}
.maplibregl-popup-close-button{font-size:20px;right:6px;top:3px;color:var(--mute);border-radius:50%;width:28px;height:28px}
.maplibregl-ctrl-attrib{font-size:10px}
#map .maplibregl-ctrl-top-left{top:calc(58px + env(safe-area-inset-top, 0px));left:calc(6px + env(safe-area-inset-left, 0px))}
.maplibregl-ctrl-attrib.maplibregl-compact{background:rgba(255,255,255,.8)}
.cm{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--c,#24254A);color:#fff;border:2.5px solid #fff;box-shadow:0 3px 8px rgba(36,37,74,.35);font:700 12px/1 system-ui,sans-serif;position:relative}
.cm .ic{width:15px;height:15px}
.cm b{position:absolute;top:-7px;right:-7px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:#fff;color:var(--ink);font-size:10.5px;display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.cm.sm{width:24px;height:24px;border-width:2px}.cm.sm .ic{width:12px;height:12px}.cm.sm b{top:-6px;right:-6px;min-width:15px;height:15px;font-size:9.5px}
.cm.done{background:#fff;color:var(--c)}
.cm.stop{background:#D71F2B;width:36px;height:36px;font:400 16px/1 Fraunces,Georgia,serif}
.cm.spot{width:16px;height:16px;background:#fff;border:3px solid #24254A}
.cmlab{font:700 12px/1.2 system-ui,sans-serif;color:var(--ink);white-space:nowrap;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff}
.me{width:18px;height:18px;border-radius:50%;background:#2F7BFF;border:3px solid #fff;box-shadow:0 0 0 6px rgba(47,123,255,.22),0 2px 6px rgba(0,0,0,.3)}
.pop b{display:block;font-size:15px;line-height:1.25}
.pop span{display:block;font-size:12px;opacity:.7;margin:2px 0 8px}
.pop .pl{display:flex;gap:6px;flex-wrap:wrap}
.pop a,.pop button,.mapl a,.mapl button{display:inline-flex;align-items:center;gap:5px;font:700 12.5px/1 var(--f-body);padding:8px 11px;border-radius:999px;border:1.5px solid var(--line);background:#fff;color:var(--ink);text-decoration:none;cursor:pointer}
.pop a.go,.mapl a.go{background:var(--ink);color:#fff;border-color:var(--ink)}
.mapl{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.pit.flash{outline:3px solid var(--red);outline-offset:2px;transition:outline .3s}
#zloc{position:fixed;z-index:6;right:calc(14px + env(safe-area-inset-right, 0px));top:calc(64px + env(safe-area-inset-top, 0px));width:42px;height:42px;color:var(--ink)}
#zloc[aria-pressed="true"]{background:#2F7BFF;color:#fff}
.mk.pi .cm{width:30px;height:30px}
.mk.pi.sm .cm{width:24px;height:24px;border-width:2px}.mk.pi.sm .cm .ic{width:12px;height:12px}.mk.pi.sm .cm b{top:-6px;right:-6px;min-width:15px;height:15px;font-size:9.5px}
.mk.pi.done .cm{background:#fff;color:var(--c)}
.me{width:18px;height:18px;border-radius:50%;background:#2F7BFF;border:3px solid #fff;box-shadow:0 0 0 7px rgba(47,123,255,.2),0 2px 6px rgba(0,0,0,.3)}
.brand{background:rgba(255,255,255,.9);padding:6px 18px 6px 6px;border-radius:999px;box-shadow:0 4px 16px rgba(190,70,100,.14);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.stats{display:none!important}
.hflag{font-style:normal;margin-right:12px;font-size:.85em;vertical-align:.04em}
.today{display:grid;gap:10px;padding:14px 16px;border-radius:20px;background:linear-gradient(135deg,#FFF4F7,#FFF8EA);border:1.5px solid var(--line);margin:4px 0 6px}
.today .th{display:flex;align-items:center;gap:8px;color:var(--red)}
.today .th b{color:var(--ink)}
.today h3{margin:-4px 0 0;font:italic 500 24px/1.15 var(--f-display);color:var(--ink)}
.today .now{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:16px;background:#fff}
.today .now .gi{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--gb);color:var(--gc);flex:none}
.today .now b{display:block;font-size:15.5px;line-height:1.25}
.today .now .small{display:block;font-weight:700;text-transform:uppercase;letter-spacing:.1em;font-size:10.5px}
.today .row{margin:0}
.linkb{margin-left:auto;border:0;background:none;color:var(--mute);font-weight:700;font-size:12.5px;text-decoration:underline;text-underline-offset:3px;padding:4px}
.tabs{display:flex;gap:4px;padding:4px;border-radius:999px;background:var(--soft);position:sticky;top:-4px;z-index:2;margin:6px 0 2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}

.cityrow .cc.on{outline:2px solid var(--red);outline-offset:1px}

.cc.wish{background:#FFF6D6;box-shadow:inset 0 0 0 1.5px #F2C84B}
.btn.wishon{background:#FFF6D6;border-color:#F2C84B;color:#7A5300}
.stars.ask{animation:askp 1.6s ease 2}
@keyframes askp{0%,100%{transform:none}30%{transform:scale(1.08)}}
.camb{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;margin-left:auto}
.pphotos{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}

.near{display:grid;gap:8px;padding:12px 14px;border-radius:20px;background:#F1F4FF;margin:4px 0 8px}
.near .th{display:flex;align-items:center;gap:8px;color:var(--cobalt)}.near .th b{color:var(--ink)}
.nrow{display:flex;gap:10px;align-items:center;background:#fff;border-radius:14px;padding:8px 8px 8px 10px}

.nrow .nt{flex:1;min-width:0}.nrow .nt b{display:block;font-size:14px;line-height:1.25}
.iconb{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line);background:#fff;color:var(--ink);flex:none}
.iconb.go{background:var(--ink);color:#fff;border-color:var(--ink)}
.maplegend{position:fixed;z-index:5;left:calc(12px + env(safe-area-inset-left, 0px));top:calc(62px + env(safe-area-inset-top, 0px));display:flex;gap:5px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;max-width:calc(100vw - 76px);padding:2px}
.maplegend::-webkit-scrollbar{display:none}

.maplegend button{flex:none;display:inline-flex;align-items:center;gap:5px;border:0;border-radius:999px;padding:4px 9px 4px 4px;font-size:12px!important;background:rgba(255,255,255,.95);box-shadow:0 3px 10px rgba(36,37,74,.14);font:700 12.5px/1 var(--f-body);color:var(--ink)}
.maplegend .lgi{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:#fff}.maplegend .lgi .ic{width:12px;height:12px}
.maplegend em{font-style:normal;color:var(--mute);font-weight:700}
.maplegend button[aria-pressed="false"]{opacity:.45;box-shadow:none}.maplegend button[aria-pressed="false"] .lgi{background:#B9B6C9}
.mk.pi .mlab{display:none;font-size:10px}
body.zlab .mk.pi .mlab,.mk.pi.lab .mlab{display:block}

.guide{gap:12px}
.gfacts{display:grid;gap:8px}
.gfact{display:flex;gap:10px;align-items:flex-start;background:var(--soft);border-radius:16px;padding:10px 12px;font-size:14px;line-height:1.45}
.gfact b{display:block;font-size:12.5px;color:var(--mute)}
.gi{width:26px;height:26px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--gc);color:#fff}
.gcity{border-radius:20px;background:#fff;border:1.5px solid var(--line);padding:4px 14px}
.gcity.open{padding:12px 14px;display:grid;gap:12px}
details.gcity[open]{padding-bottom:14px;display:grid;gap:12px}
.gcity summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:10px 0}
.gcity summary::-webkit-details-marker{display:none}
.gcity summary>.ic{margin-left:auto;color:var(--red);transition:transform .2s}
.gcity[open] summary>.ic{transform:rotate(45deg)}
.gcn{display:grid;min-width:0}
.gcn b{font-family:var(--f-display);font-weight:400;font-size:20px;line-height:1.15}
.ggrp{display:grid;gap:6px;margin-top:4px}
.glbl{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13.5px;color:var(--gc)}
.glbl .gi{width:24px;height:24px}
.gitem{background:var(--gb);border-radius:12px;padding:8px 12px;font-size:14.5px;line-height:1.45}
.lockb{width:36px;height:36px;border-radius:50%;border:0;background:var(--card);display:grid;place-items:center;color:var(--mute)}
.lockb.on{background:var(--red);color:#fff}
.brandrow .seg{margin-left:auto}
body.globe{background:radial-gradient(120% 90% at 30% 10%, #FFF6F8 0%, #FCE6EC 60%, #F9D9E2 100%) #FCE6EC}
.sugwrap{position:relative}
.sug{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:20;background:#fff;border-radius:18px;box-shadow:0 14px 34px rgba(190,70,100,.25);padding:6px;display:grid;gap:2px;max-height:300px;overflow-y:auto}
.sug button{display:grid;grid-template-columns:26px 1fr;column-gap:8px;align-items:center;text-align:left;border:0;background:none;border-radius:12px;padding:8px 10px;width:100%}
.sug button:hover,.sug button:focus-visible{background:var(--soft)}
.sug .sf{grid-row:span 2;font-size:20px}
.sug .sn{font-weight:700;font-size:15px;overflow-wrap:anywhere}
.sug .sk{font-size:12px;color:var(--mute)}
.sugnone{padding:10px 12px;font-size:13.5px;color:var(--mute)}
.cityedit{display:grid;gap:8px}
.ck .cities .chip{background:#fff}
details.more{display:grid;gap:12px}
details.more>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:12px 14px;border-radius:16px;background:var(--soft);font-weight:700;color:var(--red)}
details.more>summary::-webkit-details-marker{display:none}
details.more[open]>summary{margin-bottom:12px}
details.more>.cat+.cat,details.more>.cat+.field{margin-top:12px}
@media (max-width:900px){
  .panel{top:auto;left:calc(8px + env(safe-area-inset-left, 0px));right:calc(8px + env(safe-area-inset-right, 0px));bottom:calc(8px + env(safe-area-inset-bottom, 0px));width:auto;height:52%;border-radius:26px;transition:height .25s ease}
  .panel[data-size="tall"]{height:85%}
  .panel[data-size="min"]{height:auto}
  .panel[data-size="min"] .pbody{display:none}
  .panel[data-size="min"] .minbar{display:flex}
  .grab{display:block;flex:none;width:100%;height:24px;border:0;background:none;position:relative}
  .grab::after{content:"";position:absolute;left:50%;top:9px;width:44px;height:5px;border-radius:3px;background:#F2C3CF;transform:translateX(-50%)}
  .minbar{align-items:center;gap:10px;padding:2px 18px 14px;font-family:var(--f-display);font-size:18px}
  .minbar span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pscroll{padding:4px 16px 22px}
  .foot{padding:12px 16px}
  h2{font-size:28px}
  .top{left:calc(12px + env(safe-area-inset-left, 0px));right:calc(12px + env(safe-area-inset-right, 0px));top:calc(10px + env(safe-area-inset-top, 0px));gap:8px}
  .brandrow{justify-content:space-between;width:100%}
  .brand{font-size:28px}
  .seg button{padding:5px 10px}
  .seg button .lbtxt{display:none}
  .stats{padding:6px 2px}
  .pill{padding:0 9px}
  .pill b{font-size:18px}
  .pill span.l{font-size:10.5px}
  .ctrls{display:none}
  .aimbar{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

async function shrink(file){

    const k = Math.min(1, 1800 / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
    const blob = await new Promise(r => c.toBlob(r, "image/jpeg", .84));
    return blob && blob.size < file.size ? blob : file;
  } catch(e) { return file; }
}

/* ---------- storage: data/items.json in the repo, edits through the Cloudflare Worker ---------- */
const PKEY = "singladura.pending", KKEY = "singladura.key";
let CFG = {api:""}, KEY = "";
try { KEY = localStorage.getItem(KKEY) || ""; } catch(e) {}
let PENDING = {}; try { PENDING = JSON.parse(localStorage.getItem(PKEY) || "{}") || {}; } catch(e) { PENDING = {}; }
const savePending = () => { try { localStorage.setItem(PKEY, JSON.stringify(PENDING)); } catch(e) {} };
const pendingCount = () => Object.values(PENDING).filter(p => !p.ok).length;
// two ways to save: a Cloudflare Worker (CFG.api) or, with a personal GitHub key kept only on this phone, straight to GitHub
const isGhKey = k => /^(github_pat_|ghp_)/.test(k || "");
const LIVE = () => !!KEY && (!!CFG.api || isGhKey(KEY));
const SITE_REPO = () => CFG.site || "angelapereiralosada/Singladura", NOTES_REPO = () => CFG.notes || "angelapereiralosada/singladura-notas";
const ghFetch = (repo, path, method = "GET", body) => fetch(`https://api.github.com/repos/${repo}/contents/${path}`, {method, cache: "no-store",
  headers: {Authorization: "Bearer " + KEY, Accept: "application/vnd.github+json"}, body: body ? JSON.stringify(body) : undefined});
const b64e = str => { const by = new TextEncoder().encode(str); let bin = ""; for (let i = 0; i < by.length; i += 0x8000) bin += String.fromCharCode(...by.subarray(i, i + 0x8000)); return btoa(bin); };
const b64d = b => new TextDecoder().decode(Uint8Array.from(atob(b.replace(/\n/g, "")), c => c.charCodeAt(0)));
async function ghRead(repo, path, fallback){ const r = await ghFetch(repo, path); if (r.status === 404) return {data: fallback, sha: null}; if (!r.ok) throw Object.assign(new Error("gh"), {status: r.status}); const j = await r.json(); return {data: JSON.parse(b64d(j.content)), sha: j.sha}; }
async function ghMerge(repo, path, fallback, change, msg){
  for (let k = 0; k < 3; k++) {
    const {data, sha} = await ghRead(repo, path, fallback);
    const r = await ghFetch(repo, path, "PUT", {message: msg, content: b64e(JSON.stringify(change(data), null, 1)), ...(sha ? {sha} : {})});
    if (r.ok) return 200; if (r.status !== 409 && r.status !== 422) return r.status;
  }
  return 409;
}
const resp = (status, body) => new Response(JSON.stringify(body ?? {}), {status, headers: {"Content-Type": "application/json"}});
async function ghApi(path, opts){
  try {
    const body = opts.body ? JSON.parse(opts.body) : {};
    if (path === "/check") {
      const h = {headers: {Authorization: "Bearer " + KEY, Accept: "application/vnd.github+json"}, cache: "no-store"};
      const u = await fetch("https://api.github.com/user", h);
      if (u.status === 401) return resp(401, {why: "llave"});
      for (const repo of [SITE_REPO(), NOTES_REPO()]) {
        const r = await fetch(`https://api.github.com/repos/${repo}`, h);
        if (!r.ok) return resp(401, {why: "repo", repo: repo.split("/")[1], code: r.status});
        const j = await r.json(); if (j.permissions && !j.permissions.push) return resp(401, {why: "permiso", repo: repo.split("/")[1]});
      }
      return resp(200);
    }
    if (path === "/save") return resp(await ghMerge(SITE_REPO(), "data/items.json", [], data => { const m = new Map(data.map(x => [x.id, x])); for (const [id, d] of Object.entries(body.set || {})) m.set(id, {...d, id}); for (const id of body.del || []) m.delete(id); return [...m.values()]; }, "Actualiza el diario desde la app"));
    if (path === "/notes") { const {data} = await ghRead(NOTES_REPO(), "notas.json", []); return resp(200, data); }
    if (path === "/note") return resp(await ghMerge(NOTES_REPO(), "notas.json", [], data => data.some(n => n.id === body.id) ? data : [...data, body], "Nueva nota"));
    if (path === "/photo") { const ph = `photos/${Date.now().toString(36)}${Math.random().toString(36).slice(2, 7)}.${body.ext === "png" ? "png" : "jpg"}`; const r = await ghFetch(SITE_REPO(), ph, "PUT", {message: "Añade una foto", content: body.data}); return r.ok ? resp(200, {path: ph}) : resp(r.status); }
    return resp(404);
  } catch(e) { return resp(e.status === 401 ? 401 : 503); }
}
const api = (path, opts = {}) => isGhKey(KEY) ? ghApi(path, opts) : fetch(CFG.api.replace(/\/$/, "") + path, {...opts, headers: {"Content-Type":"application/json", "X-Key": KEY, ...(opts.headers || {})}});
let syncT = null, syncing = false;
function queueSync(){ clearTimeout(syncT); syncT = setTimeout(sync, 1500); }
async function sync(){
  if (!LIVE() || syncing) return;
  const ids = Object.keys(PENDING).filter(id => !PENDING[id].ok); if (!ids.length) return;
  const set = {}, del = [];
  for (const id of ids) { const p = PENDING[id]; if (p.doc) set[id] = p.doc; else del.push(id); }
  syncing = true;
  try {
    const r = await api("/save", {method:"POST", body: JSON.stringify({set, del})});
    if (r.status === 401) { lock(); toast("La contraseña ya no vale. Vuelve a entrar."); return; }
    if (!r.ok) throw new Error(r.status);
    const now = Date.now(); for (const id of ids) if (PENDING[id] && PENDING[id].at <= now) { PENDING[id].ok = true; PENDING[id].okAt = now; }
    savePending();
  } catch(e) { setTimeout(sync, 15000); }
  finally { syncing = false; if (pendingCount()) queueSync(); }
}
function applyPending(items){
  const now = Date.now(), map = new Map(items.map(x => [x.id, x]));
  for (const [id, p] of Object.entries(PENDING)) {
    if (p.ok && now - (p.okAt || 0) > 20 * 60 * 1000) { delete PENDING[id]; continue; }
    if (p.doc) map.set(id, {id, ...p.doc}); else map.delete(id);
  }
  savePending(); return [...map.values()];
}

const Store = {

    const i = S.items.findIndex(p => p.id === id);
    if (i >= 0) S.items[i] = {id, ...data}; else S.items.push({id, ...data});
    PENDING[id] = {doc: data, at: Date.now()}; savePending(); queueSync();
    if (S.view !== "form") keepScroll(render); return true;
  },
  async remove(id){
    if (!S.canEdit) return false;
    S.items = S.items.filter(p => p.id !== id);
    PENDING[id] = {doc: null, at: Date.now()}; savePending(); queueSync(); render(); return true;
  }
};

    const r = await unlock(pw);
    if (r === "ok") { toast("Modo edición activado"); goList(); }
    else { btn.disabled = false; btn.textContent = "Entrar"; $("#pw-err").textContent = r === "bad" ? (!isGhKey(pw) ? "Eso no parece una llave de GitHub: tiene que empezar por github_pat_" : S.loginWhy?.why === "llave" ? "GitHub dice que esa llave no existe o ha caducado. Cópiala otra vez entera." : S.loginWhy?.why === "repo" ? `La llave no puede ver el repositorio «${S.loginWhy.repo}». En GitHub, edita la llave: en «Repository access» elige «Only select repositories» y marca Singladura y singladura-notas.` : S.loginWhy?.why === "permiso" ? `La llave puede ver «${S.loginWhy.repo}» pero no escribir. En «Permissions», pon «Contents» en «Read and write».` : "GitHub no acepta esa llave.") : "No hay conexión. Inténtalo en un momento."; }
  };
}
let toastT;
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2800); }
async function shareLink(hash, title, kind){
  const url = location.origin + location.pathname + "#" + hash;
  const text = `${kind}: ${title}`;
  try { if (navigator.share) { await navigator.share({title: `${title} · Singladura`, text, url}); return; } } catch(e) { if (e?.name === "AbortError") return; }
  try { await navigator.clipboard.writeText(url); toast("Enlace copiado. Pégalo en WhatsApp."); } catch(e) { prompt("Copia este enlace:", url); }
}
function setHash(h){ try { history.replaceState(null, "", h ? "#" + h : location.pathname + location.search); } catch(e) {} }
let firstLoad = true;
function afterLoad(){
  if (firstLoad) {
    firstLoad = false;
    const m = /^#pais-([a-z]{2})$/.exec(location.hash);
    if (m && byId.get(m[1].toUpperCase())) return openCountry(m[1].toUpperCase(), true);
    const r = /^#ruta-(.+)$/.exec(location.hash);
    if (r && trips().some(t => t.id === decodeURIComponent(r[1]))) return openTrip(decodeURIComponent(r[1]));
  }
  const ae = document.activeElement;
  if (S.view === "form" || S.view === "stage" || ((S.view === "checklist" || S.view === "country") && ae && panel.contains(ae) && ae.matches("input[type=search], input[data-addcity]"))) renderStats(); else render();
}

/* ---------- boot ---------- */
addEventListener("resize", layout);
// coming back to the app (it stays open in the background on the phone): fetch the latest diary and notes
let lastFresh = Date.now();
async function refreshData(force){
  if (!S.loaded || (!force && Date.now() - lastFresh < 20000)) return; lastFresh = Date.now();
  let items = null;
  try {
    if (isGhKey(KEY)) items = (await ghRead(SITE_REPO(), "data/items.json", [])).data;
    else { const r = await fetch("data/items.json?v=" + Date.now(), {cache: "no-store"}); if (r.ok) items = await r.json(); }
  } catch(e) {}
  if (Array.isArray(items)) { S.items = applyPending(items); afterLoad(); }
  if (LIVE()) loadNotes();
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) refreshData(); });
addEventListener("focus", () => refreshData());
addEventListener("hashchange", () => {
  const m = /^#pais-([a-z]{2})$/.exec(location.hash), r = /^#ruta-(.+)$/.exec(location.hash);
  if (m && byId.get(m[1].toUpperCase())) openCountry(m[1].toUpperCase(), true);
  else if (r && trips().some(t => t.id === decodeURIComponent(r[1]))) openTrip(decodeURIComponent(r[1]));
});
addEventListener("keydown", e => { if (e.key === "Escape") { if (!$("#lightbox").hidden) $("#lightbox").hidden = true; else if (S.view === "detail" || S.view === "country") goList(); } });
layout(); initMap(); render();
if ("serviceWorker" in navigator && location.protocol === "https:") addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));

(async () => {
  try { const c = await fetch("data/config.json?v=" + Date.now(), {cache:"no-store"}); if (c.ok) CFG = {...CFG, ...(await c.json())}; } catch(e) {}
  let items = [];
  try { if (isGhKey(KEY)) items = (await ghRead(SITE_REPO(), "data/items.json", [])).data; } catch(e) {}
  if (!items.length) try { const r = await fetch("data/items.json?v=" + Date.now(), {cache:"no-store"}); if (r.ok) items = await r.json(); } catch(e) {}
  S.mode = "gh";
  S.items = applyPending(Array.isArray(items) ? items : []);
  S.loaded = true;
  if (KEY) {
    setEditing(true); loadNotes(); sync();
    if (LIVE()) api("/check").then(r => { if (r.status === 401) lock(); }).catch(() => {});
  } else loadLocalMsgs();
  afterLoad();
})();
})();
</script>
