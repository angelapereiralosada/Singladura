<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Diario de a bordo de mis viajes: países, rutas, guías y recomendaciones.">
<meta name="theme-color" content="#FCE6EC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Singladura">
<meta property="og:title" content="Singladura">
<meta property="og:description" content="Diario de a bordo de mis viajes">
<meta property="og:image" content="icons/icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}body{font-size:14px;-webkit-text-size-adjust:100%}</style>
<title>Singladura</title>
</head>
<body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400;1,9..144,500&family=Caveat:wght@600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap">
<style>
/* Layout: an illustrated world map — pink sea, white land, countries you've been to inked in a small poster palette. Name and figures top-left, a soft white card panel on the right (bottom sheet on phones). Single look by design. */
:root{
  --sea:#F8C8D4;
  --sea-ink:#EE97AE;
  --card:#FFFFFF;
  --ink:#24254A;
  --mute:#6E6A86;
  --line:#F1E1E7;
  --soft:#FFF3F6;
  --red:#D71F2B;
  --cobalt:#3552E0;
  --mustard:#E8A71C;
  --mustard-ink:#9A6400;
  --wine:#8C1D3F;
  --f-display:"Fraunces",Georgia,"Times New Roman",serif;
  --f-hand:"Caveat","Comic Sans MS",cursive;
  --f-body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--sea);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;overflow:hidden;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:0;
}
#globe{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#globe.grabbing{cursor:grabbing}
#citymap{position:fixed;inset:0;z-index:2;display:none;background:#F3E6E4}
body.city #citymap{display:block}
body.city .stats,body.city .seg,body.city .hint{display:none}
#citymap .leaflet-tile-pane{filter:saturate(.9) sepia(.1) hue-rotate(-10deg)}
#citymap .leaflet-control-attribution{font-size:9px;background:rgba(255,255,255,.7);border-radius:8px 0 0 0}
.cm{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--c,#24254A);color:#fff;border:2.5px solid #fff;box-shadow:0 3px 8px rgba(36,37,74,.35);font:700 12px/1 system-ui,sans-serif;position:relative}
.cm .ic{width:15px;height:15px}
.cm b{position:absolute;top:-7px;right:-7px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:#fff;color:var(--ink);font-size:10.5px;display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.cm.sm{width:24px;height:24px;border-width:2px}.cm.sm .ic{width:12px;height:12px}.cm.sm b{top:-6px;right:-6px;min-width:15px;height:15px;font-size:9.5px}
.cm.done{background:#fff;color:var(--c)}
.cm.stop{background:#D71F2B;width:36px;height:36px;font:400 16px/1 Fraunces,Georgia,serif}
.cm.spot{width:16px;height:16px;background:#fff;border:3px solid #24254A}
.cmlab{font:700 12px/1.2 system-ui,sans-serif;color:var(--ink);white-space:nowrap;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff}
.me{width:18px;height:18px;border-radius:50%;background:#2F7BFF;border:3px solid #fff;box-shadow:0 0 0 6px rgba(47,123,255,.22),0 2px 6px rgba(0,0,0,.3)}
.leaflet-popup-content-wrapper{border-radius:18px;box-shadow:0 10px 30px rgba(190,70,100,.25)}
.leaflet-popup-content{margin:12px 14px;font-family:var(--f-body);color:var(--ink);min-width:170px}
.pop b{display:block;font-size:15px;line-height:1.25}
.pop span{display:block;font-size:12px;opacity:.7;margin:2px 0 8px}
.pop .pl{display:flex;gap:6px;flex-wrap:wrap}
.pop a,.pop button,.mapl a,.mapl button{display:inline-flex;align-items:center;gap:5px;font:700 12.5px/1 var(--f-body);padding:8px 11px;border-radius:999px;border:1.5px solid var(--line);background:#fff;color:var(--ink);text-decoration:none;cursor:pointer}
.pop a.go,.mapl a.go{background:var(--ink);color:#fff;border-color:var(--ink)}
.mapl{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.pit.flash{outline:3px solid var(--red);outline-offset:2px;transition:outline .3s}
#zloc{display:none;position:fixed;z-index:6;right:calc(16px + env(safe-area-inset-right, 0px));top:calc(70px + env(safe-area-inset-top, 0px));width:auto;height:40px;padding:0 14px 0 11px;border-radius:999px;gap:7px;align-items:center;font:700 13px/1 var(--f-body);color:var(--ink)}
body.city #zloc{display:inline-flex}
body.city .brand{background:rgba(255,255,255,.92);padding:5px 16px 5px 5px;border-radius:999px;box-shadow:0 4px 14px rgba(36,37,74,.12)}
body.city .brand .rose{width:30px;height:30px}
body.city .brand .wm b{font-size:22px}
body.city .brand .wm span{display:none}
#citymap .leaflet-top.leaflet-right{top:calc(116px + env(safe-area-inset-top, 0px))}
@media (min-width:901px){ #zloc{right:calc(432px + env(safe-area-inset-right, 0px));top:calc(22px + env(safe-area-inset-top, 0px))} #citymap .leaflet-top.leaflet-right{top:auto;bottom:0;right:416px} }
#zloc[aria-pressed="true"]{background:#2F7BFF;color:#fff}
#globe.aim{cursor:crosshair}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--cobalt);outline-offset:2px}
.ic{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic.lg{width:24px;height:24px}
.ic.sm{width:15px;height:15px}

/* Name + figures */
.top{position:fixed;z-index:6;top:calc(16px + env(safe-area-inset-top, 0px));left:calc(22px + env(safe-area-inset-left, 0px));display:grid;gap:10px;pointer-events:none;justify-items:start}
.top>*{pointer-events:auto}
.brandrow{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;color:var(--ink)}
.brand svg.rose{width:40px;height:40px;flex:none}
.brand .wm{display:grid;line-height:1}
.brand .wm b{font-family:var(--f-display);font-style:italic;font-weight:500;font-size:34px;letter-spacing:-.02em;color:var(--red)}
.brand .wm span{font-size:10.5px;font-weight:700;letter-spacing:.32em;text-transform:uppercase;color:var(--ink);opacity:.7;margin-top:3px}
.brand em{font-style:normal;color:var(--cobalt)}
.seg{display:inline-flex;padding:3px;border-radius:999px;background:var(--card)}
.seg button{display:inline-flex;align-items:center;gap:6px;border:0;background:none;padding:6px 12px;border-radius:999px;font-weight:700;font-size:13px;color:var(--mute)}
.seg button[aria-pressed="true"]{background:var(--red);color:#fff}
.stats{display:flex;gap:4px;flex-wrap:wrap;background:var(--card);border-radius:18px;padding:8px 6px}
.pill{display:grid;justify-items:center;padding:0 12px}
.pill+.pill{border-left:1.5px dashed var(--line)}
.pill b{font-family:var(--f-display);font-style:italic;font-weight:400;font-size:25px;line-height:1.1;font-variant-numeric:tabular-nums;color:var(--c, var(--ink))}
.pill:nth-child(1){--c:var(--red)} .pill:nth-child(2){--c:var(--cobalt)} .pill:nth-child(3){--c:var(--mustard-ink)} .pill:nth-child(4){--c:var(--wine)}
.pill span.l{font-size:11.5px;font-weight:500;color:var(--mute)}

.ctrls{position:fixed;z-index:5;display:flex;gap:8px;align-items:center;left:calc(22px + env(safe-area-inset-left, 0px));bottom:calc(20px + env(safe-area-inset-bottom, 0px))}
.ctrl{width:42px;height:42px;border-radius:50%;border:0;background:var(--card);display:grid;place-items:center;color:var(--red);box-shadow:0 4px 12px rgba(200,80,110,.18)}
.ctrl:hover{background:var(--soft)}
.hint{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink);opacity:.65;margin-left:8px}

.aimbar{position:fixed;z-index:6;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom, 0px));display:inline-flex;align-items:center;gap:8px;padding:9px 18px;border-radius:999px;background:var(--cobalt);color:#fff;font-weight:700;font-size:14px;pointer-events:none;max-width:calc(100vw - 32px)}

/* Panel */
.panel{position:fixed;z-index:8;top:calc(16px + env(safe-area-inset-top, 0px));bottom:calc(16px + env(safe-area-inset-bottom, 0px));right:calc(16px + env(safe-area-inset-right, 0px));width:400px;background:var(--card);border-radius:26px;box-shadow:0 20px 50px rgba(190,70,100,.22);display:flex;flex-direction:column;overflow:hidden}
.grab{display:none}
.minbar{display:none}
.pbody{flex:1;display:flex;flex-direction:column;min-height:0}
.pscroll{flex:1;overflow-y:auto;padding:24px 24px 28px;display:grid;align-content:start;gap:20px;min-height:0;overscroll-behavior:contain}
.phead{display:flex;align-items:center;justify-content:space-between;gap:12px}
.phead>div{min-width:0}
h2{font-family:var(--f-display);font-style:italic;font-weight:400;font-size:34px;letter-spacing:-.015em;line-height:1.05;margin:0;text-wrap:balance;overflow-wrap:anywhere;color:var(--ink)}
.kicker{font-size:11px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--red);line-height:1;margin-bottom:8px}
.muted{color:var(--mute)}
.small{font-size:13.5px}
.sec{display:grid;gap:10px}
.sectitle{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-size:20px;color:var(--ink)}
.sectitle .ic{color:var(--red)}
.sectitle .n{font-family:var(--f-body);font-size:12px;font-weight:700;background:var(--soft);color:var(--red);border-radius:999px;padding:1px 9px}
.lbl{display:flex;align-items:center;gap:7px;font-weight:700;font-size:13.5px}

.btn{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:9px 16px;font-weight:700;font-size:14px;transition:background .15s, transform .1s;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;min-height:44px;color:var(--ink)}
.btn:hover{background:var(--soft)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.55;cursor:default}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.primary:hover{background:#B5141F}
.btn.ghost{border-color:transparent;background:none;padding:8px 4px;color:var(--mute)}
.btn.ghost:hover{color:var(--red)}
.btn.sm{min-height:36px;padding:6px 13px;font-size:13px}
.btn.danger{color:var(--red);border-color:#F5C6CA;background:#FFF0F1}
.btn.danger.solid{background:var(--red);color:#fff;border-color:var(--red)}
.btn.on{background:#E9EDFF;border-color:#C9D2FF;color:var(--cobalt)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1}

.searchwrap{position:relative}
.searchwrap .ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--mute)}
.search{width:100%;padding:11px 14px 11px 42px;border-radius:999px;border:1.5px solid var(--line);background:var(--soft);font-size:16px}
.search:focus{outline:none;border-color:var(--red);background:#fff}

.list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.item{display:grid;grid-template-columns:50px 1fr auto;gap:12px;align-items:center;padding:8px;border-radius:20px;border:0;background:var(--soft);transition:background .15s;width:100%;text-align:left}
.item:hover{background:#FFE6EC}
.item>div{min-width:0}
.av{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;font-size:25px;background:#fff;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.item .t{font-family:var(--f-display);font-size:19px;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .s{font-size:13px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini{display:flex;gap:4px}
.mini span{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:700;padding:3px 7px;border-radius:999px;color:var(--c);background:#fff;font-variant-numeric:tabular-nums}
.c-seen{--c:var(--cobalt);--cbg:#ECEFFF}
.c-done{--c:var(--wine);--cbg:#F8E6EC}
.c-ate{--c:var(--mustard-ink);--cbg:#FFF4D6}
.tag{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--cobalt);margin-left:8px;vertical-align:3px}

.ccs{display:flex;flex-wrap:wrap;gap:8px}
.cc{display:inline-flex;align-items:center;gap:8px;padding:5px 13px 5px 5px;border-radius:999px;border:0;background:var(--soft);font-size:14px;font-weight:700;min-height:38px;transition:background .15s}
.cc:hover{background:#FFE6EC}
.cc .fl{width:28px;height:28px;border-radius:50%;background:var(--sw);display:grid;place-items:center;font-size:15px}
.cc em{font-style:normal;font-size:11.5px;font-weight:700;color:#fff;background:var(--red);border-radius:999px;padding:0 7px}
.cc.city{background:#fff;border:1.5px solid var(--line)}
.cc.city .sw{width:10px;height:10px;border-radius:50%;background:var(--sw);margin-left:6px}
.inp{width:100%;padding:12px 14px;border-radius:16px;border:1.5px solid var(--line);background:var(--soft);font-size:16px}
.inp:focus{outline:none;border-color:var(--red);background:#fff}
textarea.inp{min-height:90px;resize:vertical}

.note{padding:12px 16px;border-radius:18px;background:#ECEFFF;color:#2A3A9E;font-size:14px;display:grid;gap:10px}
.note.warn{background:#FFF3D6;color:#8A5A00}
.empty{padding:22px 18px;border-radius:20px;background:var(--soft);text-align:center;display:grid;gap:6px;justify-items:center;color:var(--mute);font-size:14px}
.empty .ic{width:28px;height:28px;color:var(--red)}
.empty b{color:var(--ink);font-family:var(--f-display);font-weight:400;font-size:19px}

.hero{display:grid;gap:10px}
.hero .meta{display:flex;flex-wrap:wrap;gap:8px}
.chipmeta{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;background:var(--soft);font-size:13px;font-weight:700}
.bigflag{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;font-size:38px;background:var(--soft)}
.block{border-radius:22px;padding:14px 16px;display:grid;gap:10px;background:var(--cbg)}
.block h3{margin:0;display:flex;align-items:center;gap:9px;font-family:var(--f-display);font-weight:400;font-size:19px;color:var(--c)}
.block h3 .bub{width:32px;height:32px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center}
.block h3 .ct{margin-left:auto;font-family:var(--f-body);font-size:12px;font-weight:700;background:#fff;border-radius:999px;padding:1px 9px}
.block ul{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.block li{background:#fff;border-radius:14px;padding:8px 12px;font-weight:500;overflow-wrap:anywhere}
.block .none{color:var(--mute);font-size:13.5px}
.journal{white-space:pre-wrap;font-family:var(--f-hand);font-size:23px;font-weight:600;line-height:1.25;color:var(--ink);background:var(--soft);border-radius:20px;padding:12px 16px;overflow-wrap:anywhere}
.polas{display:flex;gap:14px;overflow-x:auto;padding:8px 4px 14px;scroll-snap-type:x mandatory}
.pola{flex:none;width:64%;max-width:240px;margin:0;background:#fff;padding:8px 8px 34px;border-radius:6px;box-shadow:0 8px 20px rgba(190,70,100,.22);transform:rotate(var(--r));scroll-snap-align:center;position:relative}
.pola img{width:100%;aspect-ratio:1;object-fit:cover;display:block;cursor:zoom-in;background:var(--soft);border-radius:2px}
.pola figcaption{position:absolute;left:10px;right:10px;bottom:4px;font-family:var(--f-hand);font-weight:700;font-size:20px;color:var(--red);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.photos figure{margin:0;position:relative;aspect-ratio:1;max-width:100%;border-radius:16px;overflow:hidden;background:var(--soft)}
.photos img{width:100%;height:100%;object-fit:cover;display:block}
.photos .x{position:absolute;top:5px;right:5px;width:28px;height:28px;border-radius:50%;border:0;background:#fff;display:grid;place-items:center;color:var(--ink)}
.photos .up{display:grid;place-items:center;align-content:center;gap:4px;border:2px dashed #F4B8C7;background:#fff;color:var(--red);font-size:12.5px;font-weight:700;text-align:center;position:relative}
.photos .up input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}

.field{display:grid;gap:7px}
.two{display:grid;grid-template-columns:1.3fr 1fr;gap:10px}
.two>*{min-width:0}
.loc{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:16px;background:#FFF3D6;color:#8A5A00;font-size:14px;font-weight:700;flex-wrap:wrap}
.loc.set{background:#ECEFFF;color:#2F45C4}
.loc .btn{margin-left:auto}
.cat{border-radius:22px;padding:12px;display:grid;gap:8px;background:var(--cbg)}
.cat .lbl{color:var(--c)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips:empty{display:none}
.chip{display:inline-flex;align-items:center;gap:2px;padding:4px 4px 4px 12px;border-radius:999px;font-size:14px;font-weight:500;background:#fff;max-width:100%}
.chip span{overflow-wrap:anywhere}
.chip button{border:0;background:none;width:28px;height:28px;border-radius:50%;color:var(--mute);display:grid;place-items:center;flex:none}
.chip button:hover{color:var(--red);background:var(--soft)}
.addrow{display:flex;gap:6px}
.addrow .inp{padding:10px 12px;background:#fff;border-color:transparent}
.addrow .inp:focus{border-color:var(--c)}
.addrow .btn{background:var(--c);border-color:var(--c);color:#fff;width:46px;padding:0}
.err{color:var(--red);font-size:14px;font-weight:700}
.err:empty{display:none}
.foot{display:flex;gap:10px;justify-content:flex-end;padding:14px 24px;border-top:1.5px solid var(--line);background:#fff}
.sharebox{width:100%;min-height:150px;font-size:13px}

.ckl{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.ck{border-radius:18px;background:var(--soft);transition:background .15s}
.ck.on{background:#FFE6EC}
.ck label{display:flex;align-items:center;gap:12px;padding:10px 12px;cursor:pointer;font-weight:700}
.ck input[type=checkbox]{appearance:none;-webkit-appearance:none;width:26px;height:26px;border-radius:50%;border:2px solid #F0B9C6;background:#fff;display:grid;place-items:center;flex:none;margin:0;cursor:pointer}
.ck input[type=checkbox]:checked{background:var(--red);border-color:var(--red)}
.ck input[type=checkbox]:checked::after{content:"";width:7px;height:12px;border:solid #fff;border-width:0 3px 3px 0;transform:translateY(-2px) rotate(45deg)}
.ck .fl{font-size:22px;line-height:1}
.ck .nm{flex:1;min-width:0;overflow-wrap:anywhere}
.ck .tag{font-size:15px}
.ck .cities{padding:0 12px 12px 50px}
.ck .cities .inp{background:#fff;padding:9px 12px;font-size:15px}
.stick{position:sticky;top:-4px;z-index:2;background:var(--card);padding-block:4px 10px;display:grid;gap:10px}

.toast{position:fixed;z-index:30;left:50%;transform:translateX(-50%);top:calc(18px + env(safe-area-inset-top, 0px));display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:999px;background:var(--ink);color:#fff;font-weight:700;font-size:14px;max-width:calc(100vw - 32px)}
.lightbox{position:fixed;inset:0;z-index:40;background:rgba(36,37,74,.9);display:grid;place-items:center;padding:calc(20px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));cursor:zoom-out}
.lightbox img{max-width:100%;max-height:100%;border:10px solid #fff;border-bottom-width:40px;border-radius:6px}

.trips{display:grid;gap:8px}
.tellc{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;text-align:left;border:0;border-radius:20px;padding:10px 14px 10px 10px;background:var(--soft);color:var(--ink)}
.tellc b{display:block;font-family:var(--f-display);font-weight:400;font-size:19px;line-height:1.1}
.tellc .tico{width:48px;height:48px;border-radius:16px;background:var(--cobalt);color:#fff;display:grid;place-items:center}
.tellc em{font-style:normal;font-size:12px;font-weight:700;color:#fff;background:var(--red);border-radius:999px;padding:1px 8px}
.bubbles{display:grid;gap:8px;justify-items:end}
.bday{justify-self:center;font-size:12px;font-weight:700;color:var(--mute);margin-top:6px}
.bub{max-width:88%;background:#DCE3FF;border-radius:20px 20px 6px 20px;padding:9px 13px 7px;display:grid;gap:3px}
.bub.done{background:#F8E6EC}
.btxt{white-space:pre-wrap;font-size:15px;line-height:1.45;overflow-wrap:anywhere}
.bmeta{display:inline-flex;align-items:center;gap:4px;justify-self:end;font-size:11.5px;color:var(--mute)}
.bub.done .bmeta{color:var(--wine)}
.bctx{font-size:11.5px;font-weight:700;color:var(--cobalt)}
.bctx.now{display:inline-flex;align-items:center;gap:4px;background:#ECEFFF;border-radius:999px;padding:3px 4px 3px 10px;justify-self:start}
.bctx.now button{border:0;background:none;width:22px;height:22px;display:grid;place-items:center;color:var(--cobalt);border-radius:50%}
.chatbar{display:grid;gap:8px;width:100%}
.chatrow{display:flex;gap:8px;align-items:flex-end}
.chatrow .inp{min-height:44px;resize:none;padding:11px 14px;border-radius:22px;line-height:1.35}
.chatrow .btn.icon{width:44px;height:44px;border-radius:50%;flex:none}
.tripc{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;text-align:left;border:0;border-radius:20px;padding:10px;background:linear-gradient(135deg,#FFE9EE,#ECEFFF);color:var(--ink)}
.tripc b{display:block;font-family:var(--f-display);font-weight:400;font-size:19px;line-height:1.1}
.tripc .tico{width:48px;height:48px;border-radius:16px;background:#fff;color:var(--red);display:grid;place-items:center}
.tripc>.ic{color:var(--red)}
.tl{list-style:none;margin:0;padding:0;display:grid}
.tl li{position:relative;padding-left:0}
.tl .leg{display:flex;align-items:center;gap:8px;margin:0 0 0 13px;padding:10px 0 10px 22px;border-left:3px dashed var(--lc);font-size:13px;font-weight:700;color:var(--lc)}
.tl li:first-child .leg{border-left-style:solid;border-left-color:transparent;padding-left:0;margin-left:0}
.stopb{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:4px 0;text-align:left}
.stopb .num{width:30px;height:30px;flex:none;border-radius:50%;display:grid;place-items:center;background:#fff;border:2px solid var(--ink);font-family:var(--f-display);font-size:14px;transition:background .15s}
.stopb .sn{display:grid;min-width:0}
.stopb b{font-family:var(--f-display);font-weight:400;font-size:20px;line-height:1.15;overflow-wrap:anywhere}
.tl li.cur .num{background:var(--red);border-color:var(--red);color:#fff}
.tl li.cur .stopb b{color:var(--red)}
.sd{margin:4px 0 4px 15px;padding:6px 0 10px 25px;border-left:3px solid var(--line);display:grid;gap:12px}
.tl li:not(.cur) .sd{display:none}
.stopb{border-radius:18px;padding:8px 10px 8px 0}
.stopb>.ic{margin-left:auto;color:var(--red);transition:transform .2s}
.tl li.cur .stopb>.ic{transform:rotate(45deg)}
.pitems{display:grid;gap:10px}
.pit{background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:12px 12px 8px;display:grid;gap:8px}
.pit.done{background:#FBFBFD}
.pih{display:flex;align-items:flex-start;gap:10px}
.pih .gi{margin-top:2px}
.pit-t{display:grid;min-width:0;flex:1}
.pit-t b{font-family:var(--f-display);font-weight:500;font-size:17px;line-height:1.2;overflow-wrap:anywhere}
.pit.done .pit-t b{text-decoration:line-through;text-decoration-color:rgba(36,37,74,.35)}
.pit-x{margin:0;font-size:14.5px;line-height:1.55}
.pit-s{margin:0;display:flex;gap:8px;align-items:flex-start;font-size:13.5px;line-height:1.45;background:#FFF4D6;border-radius:12px;padding:7px 10px;color:var(--ink)}
.pit-s .ic{color:#9A6400;margin-top:2px}
.pit-s.reco{background:#FDE7E9}.pit-s.reco .ic{color:var(--red)}
.pdone{width:34px;height:34px;flex:none;border-radius:50%;border:1.5px solid var(--line);background:#fff;display:grid;place-items:center;color:var(--mute)}
.pdone[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}
.stars{display:flex;align-items:center;gap:0}
.stars button,.stars>span:not(.muted){width:34px;height:34px;border:0;background:none;display:grid;place-items:center;color:#E2D9E0;padding:0}
.stars .ic{width:20px;height:20px}
.stars .on{color:var(--mustard)}
.stars .on .ic{fill:currentColor}
.stars .muted{margin-left:6px}
.rawbox{background:#FFF4D6;border-radius:16px;padding:10px 14px;display:grid;gap:4px}
.rawbox .lbl{color:var(--mustard-ink)}
.rawbox p{margin:0;white-space:pre-wrap;font-size:14.5px}
.story{margin:0;font-size:15.5px;line-height:1.6;color:var(--ink)}
.tintro{margin:0;font-size:15px;line-height:1.6;color:var(--mute)}
.sgrp{display:grid;gap:6px}
.sgrp .lbl{color:var(--c)}
.sgrp .sdi{background:var(--cbg)}
.sdi{display:flex;gap:8px;align-items:flex-start;font-size:14.5px;font-weight:500;background:var(--cbg);border-radius:12px;padding:7px 10px}
.sdi{display:block}
.sdn{font-family:var(--f-hand);font-size:21px;font-weight:600;line-height:1.2;color:var(--mute)}
.guide{gap:12px}
.gfacts{display:grid;gap:8px}
.gfact{display:flex;gap:10px;align-items:flex-start;background:var(--soft);border-radius:16px;padding:10px 12px;font-size:14px;line-height:1.45}
.gfact b{display:block;font-size:12.5px;color:var(--mute)}
.gi{width:26px;height:26px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--gc);color:#fff}
.gcity{border-radius:20px;background:#fff;border:1.5px solid var(--line);padding:4px 14px}
.gcity.open{padding:12px 14px;display:grid;gap:12px}
details.gcity[open]{padding-bottom:14px;display:grid;gap:12px}
.gcity summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:10px 0}
.gcity summary::-webkit-details-marker{display:none}
.gcity summary>.ic{margin-left:auto;color:var(--red);transition:transform .2s}
.gcity[open] summary>.ic{transform:rotate(45deg)}
.gcn{display:grid;min-width:0}
.gcn b{font-family:var(--f-display);font-weight:400;font-size:20px;line-height:1.15}
.ggrp{display:grid;gap:6px;margin-top:4px}
.glbl{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13.5px;color:var(--gc)}
.glbl .gi{width:24px;height:24px}
.gitem{background:var(--gb);border-radius:12px;padding:8px 12px;font-size:14.5px;line-height:1.45}
.lockb{width:36px;height:36px;border-radius:50%;border:0;background:var(--card);display:grid;place-items:center;color:var(--mute)}
.lockb.on{background:var(--red);color:#fff}
.brandrow .seg{margin-left:auto}
body.globe{background:radial-gradient(120% 90% at 30% 10%, #FFF6F8 0%, #FCE6EC 60%, #F9D9E2 100%) #FCE6EC}
.sugwrap{position:relative}
.sug{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:20;background:#fff;border-radius:18px;box-shadow:0 14px 34px rgba(190,70,100,.25);padding:6px;display:grid;gap:2px;max-height:300px;overflow-y:auto}
.sug button{display:grid;grid-template-columns:26px 1fr;column-gap:8px;align-items:center;text-align:left;border:0;background:none;border-radius:12px;padding:8px 10px;width:100%}
.sug button:hover,.sug button:focus-visible{background:var(--soft)}
.sug .sf{grid-row:span 2;font-size:20px}
.sug .sn{font-weight:700;font-size:15px;overflow-wrap:anywhere}
.sug .sk{font-size:12px;color:var(--mute)}
.sugnone{padding:10px 12px;font-size:13.5px;color:var(--mute)}
.cityedit{display:grid;gap:8px}
.ck .cities .chip{background:#fff}
details.more{display:grid;gap:12px}
details.more>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:12px 14px;border-radius:16px;background:var(--soft);font-weight:700;color:var(--red)}
details.more>summary::-webkit-details-marker{display:none}
details.more[open]>summary{margin-bottom:12px}
details.more>.cat+.cat,details.more>.cat+.field{margin-top:12px}
@media (max-width:900px){
  .panel{top:auto;left:calc(8px + env(safe-area-inset-left, 0px));right:calc(8px + env(safe-area-inset-right, 0px));bottom:calc(8px + env(safe-area-inset-bottom, 0px));width:auto;height:52%;border-radius:26px;transition:height .25s ease}
  .panel[data-size="tall"]{height:85%}
  .panel[data-size="min"]{height:auto}
  .panel[data-size="min"] .pbody{display:none}
  .panel[data-size="min"] .minbar{display:flex}
  .grab{display:block;flex:none;width:100%;height:24px;border:0;background:none;position:relative}
  .grab::after{content:"";position:absolute;left:50%;top:9px;width:44px;height:5px;border-radius:3px;background:#F2C3CF;transform:translateX(-50%)}
  .minbar{align-items:center;gap:10px;padding:2px 18px 14px;font-family:var(--f-display);font-size:18px}
  .minbar span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pscroll{padding:4px 16px 22px}
  .foot{padding:12px 16px}
  h2{font-size:28px}
  .top{left:calc(12px + env(safe-area-inset-left, 0px));right:calc(12px + env(safe-area-inset-right, 0px));top:calc(10px + env(safe-area-inset-top, 0px));gap:8px}
  .brandrow{justify-content:space-between;width:100%}
  .brand{font-size:28px}
  .seg button{padding:5px 10px}
  .seg button .lbtxt{display:none}
  .stats{padding:6px 2px}
  .pill{padding:0 9px}
  .pill b{font-size:18px}
  .pill span.l{font-size:10.5px}
  .ctrls{display:none}
  .aimbar{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

async function shrink(file){
  try {
    const url = URL.createObjectURL(file);
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const k = Math.min(1, 1800 / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
    const blob = await new Promise(r => c.toBlob(r, "image/jpeg", .84));
    return blob && blob.size < file.size ? blob : file;
  } catch(e) { return file; }
}

  const box = $("#f-loc"); if (!box) return; const f = S.form;
  box.innerHTML = isFinite(f.lat)
    ? `<div class="loc set">${ic("check", "sm")}<span>Punto marcado${f.country ? " en " + esc(countryName(f.country)) : ""}</span>${isPhone() ? `<button class="btn sm" id="b-aim">${ic("target", "sm")}Ajustar</button>` : `<span class="small" style="margin-left:auto;font-weight:600">Toca el mapa para moverlo</span>`}</div>`
    : `<div class="loc">${ic("target", "sm")}<span>${isPhone() ? "Escribe la ciudad o marca el punto" : "Escribe la ciudad o toca el mapa"}</span>${isPhone() ? `<button class="btn sm" id="b-aim">Marcar en el mapa</button>` : ""}</div>`;
  const ba = $("#b-aim"); if (ba) ba.onclick = () => { document.activeElement?.blur(); setSize("min"); renderMinbar(); };
}
async function save(){
  const f = S.form;
  CATS.forEach(c => { const el = $("#add-" + c.k); const v = el?.value.trim(); if (v) { f[c.k].push(v); el.value = ""; } });
  const err = m => { S.err = m; $("#f-err").textContent = m; };
  if (!f.name.trim()) { err("Ponle nombre al lugar."); $("#f-name").focus(); return; }
  if (!isFinite(f.lat)) { const m = findPlace(f.name, f.country || null); if (m) { f.lat = m.lat; f.lon = m.lon; f.country = f.country || m.cc; } }
  if (!isFinite(f.lat)) {
    const c = byId.get(f.country);
    if (c) { const [lon, lat] = c.properties.c; f.lon = +lon.toFixed(4); f.lat = +lat.toFixed(4); }
    else return err("Elige el país o marca el punto en el mapa.");
  }
  if (!f.country) f.country = detectCountry(f.lon, f.lat);
  const id = f.id || ("p" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6));
  const data = { name: f.name.trim(), country: f.country || "", lat: f.lat, lon: f.lon, date: f.date || "", seen: f.seen, done: f.done, ate: f.ate, note: f.note || "", photos: f.photos, updatedAt: new Date().toISOString() };
  if (f.example) data.example = true;
  const btn = $("#f-save"); btn.disabled = true; btn.textContent = "Guardando…";
  const ok = await Store.save(id, data);
  if (!ok) { btn.disabled = false; btn.textContent = "Reintentar"; return; }
  if (!S.items.some(p => p.id === id)) S.items.push({id, ...data});
  toast(f.id ? "Cambios guardados" : "📍 ¡Nuevo lugar en tu mapa!");
  S.form = null; setSize("half"); select(id, true);
}

/* ---------- storage: data/items.json in the repo, edits through the Cloudflare Worker ---------- */
const PKEY = "singladura.pending", KKEY = "singladura.key";
let CFG = {api:""}, KEY = "";
try { KEY = localStorage.getItem(KKEY) || ""; } catch(e) {}
let PENDING = {}; try { PENDING = JSON.parse(localStorage.getItem(PKEY) || "{}") || {}; } catch(e) { PENDING = {}; }
const savePending = () => { try { localStorage.setItem(PKEY, JSON.stringify(PENDING)); } catch(e) {} };
const pendingCount = () => Object.values(PENDING).filter(p => !p.ok).length;
const api = (path, opts = {}) => fetch(CFG.api.replace(/\/$/, "") + path, {...opts, headers: {"Content-Type":"application/json", "X-Key": KEY, ...(opts.headers || {})}});
let syncT = null, syncing = false;
function queueSync(){ clearTimeout(syncT); syncT = setTimeout(sync, 1500); }
async function sync(){
  if (!CFG.api || !KEY || syncing) return;
  const ids = Object.keys(PENDING).filter(id => !PENDING[id].ok); if (!ids.length) return;
  const set = {}, del = [];
  for (const id of ids) { const p = PENDING[id]; if (p.doc) set[id] = p.doc; else del.push(id); }
  syncing = true;
  try {
    const r = await api("/save", {method:"POST", body: JSON.stringify({set, del})});
    if (r.status === 401) { lock(); toast("La contraseña ya no vale. Vuelve a entrar."); return; }
    if (!r.ok) throw new Error(r.status);
    const now = Date.now(); for (const id of ids) if (PENDING[id] && PENDING[id].at <= now) { PENDING[id].ok = true; PENDING[id].okAt = now; }
    savePending();
  } catch(e) { setTimeout(sync, 15000); }
  finally { syncing = false; if (pendingCount()) queueSync(); }
}
function applyPending(items){
  const now = Date.now(), map = new Map(items.map(x => [x.id, x]));
  for (const [id, p] of Object.entries(PENDING)) {
    if (p.ok && now - (p.okAt || 0) > 20 * 60 * 1000) { delete PENDING[id]; continue; }
    if (p.doc) map.set(id, {id, ...p.doc}); else map.delete(id);
  }
  savePending(); return [...map.values()];
}
function keepScroll(fn){ const y = $("#pscroll")?.scrollTop || 0; fn(); const sc = $("#pscroll"); if (sc && y) sc.scrollTop = y; }
const Store = {
  async save(id, data){
    if (!S.canEdit) { toast("Entra en modo edición para cambiar cosas"); return false; }
    const i = S.items.findIndex(p => p.id === id);
    if (i >= 0) S.items[i] = {id, ...data}; else S.items.push({id, ...data});
    PENDING[id] = {doc: data, at: Date.now()}; savePending(); queueSync();
    if (S.view !== "form") keepScroll(render); return true;
  },
  async remove(id){
    if (!S.canEdit) return false;
    S.items = S.items.filter(p => p.id !== id);
    PENDING[id] = {doc: null, at: Date.now()}; savePending(); queueSync(); render(); return true;
  }
};
async function uploadPhoto(blob){
  const data = await new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(",")[1]); fr.onerror = rej; fr.readAsDataURL(blob); });
  const r = await api("/photo", {method:"POST", body: JSON.stringify({data, ext: /png/.test(blob.type) ? "png" : "jpg"})});
  if (!r.ok) throw Object.assign(new Error("upload"), {code: r.status === 401 ? "not_granted" : "failed"});
  const {path} = await r.json(); const url = URL.createObjectURL(blob);
  return {id: path, url};
}
function setEditing(on){
  S.canEdit = on; assets = on && CFG.api ? {upload: uploadPhoto} : null;
  $("#b-lock")?.classList.toggle("on", on);
}
async function unlock(pw){
  KEY = pw;
  if (CFG.api) {
    try { const r = await api("/check"); if (r.status === 401) { KEY = ""; return "bad"; } if (!r.ok) throw 0; }
    catch(e) { KEY = ""; return "net"; }
  }
  try { localStorage.setItem(KKEY, pw); } catch(e) {}
  setEditing(true); loadNotes(); sync(); return "ok";
}
function lock(){ KEY = ""; try { localStorage.removeItem(KKEY); } catch(e) {} setEditing(false); S.view = "list"; render(); }
function renderLogin(){
  panel.innerHTML = shell(`
    <div class="phead"><button class="btn ghost" id="b-back">${ic("back")}Volver</button></div>
    <div class="hero"><div class="kicker">Modo edición</div><h2>${S.canEdit ? "Estás editando" : "Solo para la dueña del diario"}</h2>
      <p class="tintro">${S.canEdit
        ? (CFG.api ? "Tus cambios se guardan en tu diario y tus amigos los verán en un par de minutos." : "Todavía no está conectado Cloudflare: tus cambios se guardan en este móvil y se subirán solos en cuanto lo conectemos.")
        : "Tus amigos ven el diario en modo lectura. Escribe tu contraseña para añadir viajes, valorar sitios y contarle cosas a Claude."}</p></div>
    ${S.canEdit
      ? `${pendingCount() ? `<div class="note warn"><span>${pendingCount()} ${pendingCount() === 1 ? "cambio pendiente" : "cambios pendientes"} de subir.</span></div>` : ""}<button class="btn" id="b-out">${ic("x", "sm")}Salir del modo edición</button>`
      : `<form id="f-login" class="field" autocomplete="on"><label class="lbl" for="pw">${ic("edit", "sm")}Contraseña</label><input class="inp" id="pw" type="password" autocomplete="current-password" enterkeyhint="go"><div class="err" id="pw-err"></div><button class="btn primary" type="submit">Entrar</button></form>`}`);
  wireShell();
  $("#b-back").onclick = goList;
  const bo = $("#b-out"); if (bo) bo.onclick = () => { lock(); toast("Has salido del modo edición"); };
  const f = $("#f-login");
  if (f) f.onsubmit = async e => {
    e.preventDefault(); const pw = $("#pw").value.trim(); if (!pw) { $("#pw-err").textContent = "Escribe tu contraseña."; return; }
    const btn = f.querySelector("button"); btn.disabled = true; btn.textContent = "Comprobando…";
    const r = await unlock(pw);
    if (r === "ok") { toast("Modo edición activado"); goList(); }
    else { btn.disabled = false; btn.textContent = "Entrar"; $("#pw-err").textContent = r === "bad" ? "Esa contraseña no es. Prueba otra vez." : "No hay conexión. Inténtalo en un momento."; }
  };
}
let toastT;
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2800); }
function setHash(h){ try { history.replaceState(null, "", h ? "#" + h : location.pathname + location.search); } catch(e) {} }
let firstLoad = true;
function afterLoad(){
  if (firstLoad) {
    firstLoad = false;
    const m = /^#pais-([a-z]{2})$/.exec(location.hash);
    if (m && byId.get(m[1].toUpperCase())) return openCountry(m[1].toUpperCase(), true);
  }
  const ae = document.activeElement;
  if (S.view === "form" || S.view === "stage" || ((S.view === "checklist" || S.view === "country") && ae && panel.contains(ae) && ae.matches("input[type=search], input[data-addcity]"))) renderStats(); else render();
}

/* ---------- boot ---------- */
addEventListener("resize", layout);
addEventListener("keydown", e => { if (e.key === "Escape") { if (!$("#lightbox").hidden) $("#lightbox").hidden = true; else if (S.view === "detail" || S.view === "country") goList(); } });
layout(); setLook(S.look); render();
if (!reduced) { const z1 = zoom; zoom = z1 * .78; const r1 = rot.slice(); rot = [r1[0] - 50, r1[1], 0]; fly = { t0: performance.now(), dur: 1700, ir: d3.interpolate(rot.slice(), r1), iz: d3.interpolate(zoom, z1) }; }
requestAnimationFrame(frame);

(async () => {
  try { const c = await fetch("data/config.json?v=" + Date.now(), {cache:"no-store"}); if (c.ok) CFG = {...CFG, ...(await c.json())}; } catch(e) {}
  let items = [];
  try { const r = await fetch("data/items.json?v=" + Date.now(), {cache:"no-store"}); if (r.ok) items = await r.json(); } catch(e) {}
  S.mode = "gh";
  S.items = applyPending(Array.isArray(items) ? items : []);
  S.loaded = true;
  if (KEY) {
    setEditing(true); loadNotes(); sync();
    if (CFG.api) api("/check").then(r => { if (r.status === 401) lock(); }).catch(() => {});
  } else loadLocalMsgs();
  afterLoad();
})();
})();
</script>
